name: OpenSSF Scorecard

# Runs the OpenSSF Scorecard supply-chain checks and publishes the results to the
# public OpenSSF Scorecard API, which powers the README badge and the scorecard.dev
# viewer. Weekly, plus on every push to main so the score tracks the default branch.
on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      id-token: write # publish results to the OpenSSF Scorecard API
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 api.securityscorecards.dev:443 api.osv.dev:443 api.deps.dev:443 www.bestpractices.dev:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
