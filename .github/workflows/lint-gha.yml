name: Lint GitHub Actions

# Security-audit and lint the workflows themselves with zizmor and actionlint,
# run through mise (`mise run lint:gha`) so the pipeline stays portable. The same
# tools run locally via the hk pre-push hook, so this is the enforcement path for
# contributors who do not have the hooks installed.
on:
  push:
    branches: [main]
    paths:
      - ".github/zizmor.yml"
      - ".github/workflows/**.yml"
      - ".github/workflows/**.yaml"
  pull_request:
    paths:
      - ".github/zizmor.yml"
      - ".github/workflows/**.yml"
      - ".github/workflows/**.yaml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Analyze actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout; zizmor uses the token for its online audits
    env:
      MISE_ENV: ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443 mise.jdx.dev:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 dl.google.com:443 go.dev:443 nodejs.org:443 registry.npmjs.org:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Lint workflows
        run: mise run lint:gha
        env:
          GITHUB_TOKEN: ${{ github.token }}
