# The site is built and published by the GitHub Actions workflow
# (.github/workflows/deploy.yml) via the Netlify CLI, because the per-page and
# handbook PDFs are rendered with WeasyPrint, which cannot run in Netlify's build
# image. Netlify must therefore NOT build the site itself: a native `pnpm build`
# here would publish a PDF-less site over the CI deploy.
#
# The `ignore` command decides whether a git-triggered build runs: exit code 0
# cancels the build, non-zero proceeds. Returning 0 unconditionally cancels every
# Netlify build, so the site keeps serving whatever the CI deploy last published.
[build]
  ignore = "exit 0"
