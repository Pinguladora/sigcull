{{- /* Search island. The Pagefind bundle is not loaded until the user opens
       search (click on the box, or Control/Command + K), so content pages stay
       free of the search runtime. */ -}}
<div id="pf-modal" class="pf-modal" hidden>
  <div class="pf-modal-panel" role="dialog" aria-modal="true" aria-label="{{ partial "docs/text/i18n" "Search" }}">
    <div id="pf-ui"></div>
    <p class="pf-modal-hint">Esc</p>
  </div>
</div>
<script>
(function () {
  var modal = document.getElementById("pf-modal");
  var mount = document.getElementById("pf-ui");
  var loaded = false, restore = null;

  function load() {
    if (loaded) return;
    loaded = true;
    var css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "/pagefind/pagefind-ui.css";
    document.head.appendChild(css);
    var s = document.createElement("script");
    s.src = "/pagefind/pagefind-ui.js";
    s.onload = function () {
      new PagefindUI({ element: "#pf-ui", showSubResults: false, showImages: false, resetStyles: false });
      var i = mount.querySelector("input");
      if (i) i.focus();
    };
    document.head.appendChild(s);
  }

  function open() {
    restore = document.activeElement;
    modal.hidden = false;
    document.documentElement.style.overflow = "hidden";
    load();
    var i = mount.querySelector("input");
    if (i) i.focus();
  }

  function close() {
    modal.hidden = true;
    document.documentElement.style.overflow = "";
    if (restore && restore.focus) restore.focus();
  }

  document.addEventListener("keydown", function (e) {
    if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      modal.hidden ? open() : close();
    } else if (e.key === "Escape" && !modal.hidden) {
      close();
    }
  });

  document.querySelectorAll("[data-pf-open]").forEach(function (el) {
    el.addEventListener("click", function (e) { e.preventDefault(); open(); });
  });

  modal.addEventListener("click", function (e) { if (e.target === modal) close(); });
})();

/* Copy the page as Markdown. */
(function () {
  document.querySelectorAll("[data-copy-md]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var host = btn.closest(".page-actions");
      var pre = host && host.querySelector("[data-page-md]");
      if (!pre || !navigator.clipboard) return;
      navigator.clipboard.writeText(pre.textContent).then(function () {
        var label = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(function () { btn.textContent = label; }, 1500);
      });
    });
  });
})();

/* Disclosure dropdown for the page actions. */
(function () {
  document.querySelectorAll(".pa-trigger").forEach(function (btn) {
    var menu = document.getElementById(btn.getAttribute("aria-controls"));
    if (!menu) return;
    var wrap = btn.parentNode;
    function set(open) { btn.setAttribute("aria-expanded", String(open)); menu.hidden = !open; }
    btn.addEventListener("click", function () { set(btn.getAttribute("aria-expanded") !== "true"); });
    document.addEventListener("click", function (e) { if (!wrap.contains(e.target)) set(false); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && btn.getAttribute("aria-expanded") === "true") { set(false); btn.focus(); }
    });
  });
})();
</script>
