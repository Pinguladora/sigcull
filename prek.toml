default_stages = ["pre-commit"]
default_install_hook_types = [
  "pre-commit",
  "commit-msg",
  "pre-push",
  "post-checkout",
  "post-merge",
]
fail_fast = true

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-yaml" },
  { id = "check-json", exclude = "(\\.devcontainer|\\.vscode)/.*\\.json" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/mongodb/kingfisher"
rev = "v1.109.0"
hooks = [{ id = "kingfisher" }]

[[repos]]
repo = "https://github.com/golangci/golangci-lint"
rev = "v2.12.2"
hooks = [
  { id = "golangci-lint-config-verify",
    stages = ["pre-push"],
  },
  { id = "golangci-lint",
    stages = ["pre-push"],
  },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cocogitto-commit-msg",
    name = "Cocogitto verify",
    language = "system",
    entry = "cog",
    args = ["verify", "--file"],
    stages = ["commit-msg"],
    pass_filenames = true,
  },
  {
    id = "pin-github-actions",
    name = "Pinact update GHA",
    language = "system",
    entry = "pinact",
    args = ["run"],
    stages = ["pre-push"],
    pass_filenames = false,
  },
  {
    id = "go-mod-download",
    name = "go mod download",
    language = "system",
    entry = "go",
    args = ["mod", "download"],
    stages = ["pre-push"],
    pass_filenames = false,
  },
]
