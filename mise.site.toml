# Website build tooling, layered on top of mise.toml. Loaded locally via
# .miserc's `site` env, and in the deploy job via MISE_ENV=ci,site. The Go, lint,
# and release CI jobs run with MISE_ENV=ci (no site), so they never pull it.

[tools]
typst = "0.15.1" # compiles the docs PDFs as PDF/A-3a + PDF/UA-1 (site:pdf)
