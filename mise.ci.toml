[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
install_before = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]
# Fetch npm-backend tools (the Netlify CLI) with pnpm, the project's package
# manager. pnpm comes from mise.toml, so it is installed before the CLI.
npm.package_manager = "pnpm"

# CI-only tools, layered onto mise.toml's toolchain when MISE_ENV=ci.
[tools]
"npm:netlify-cli" = "27.5.2"

[tasks."ci:git-config"]
run = """
git config --global core.compression 0
git config --global core.fsync -all
"""
description = "Optimize Git config for CI (disable compression, fsync)"

[tasks."ci:fmt"]
run = """
files=$(gofmt -l .)
if [ -n "$files" ]; then
  echo "Not gofmt-clean:"
  echo "$files"
  exit 1
fi
"""
description = "Fail if any Go file is not gofmt-clean"

[tasks."ci:tidy"]
run = """
go mod tidy
git diff --exit-code go.mod go.sum
"""
description = "Fail if go.mod or go.sum are not tidy"

[tasks."ci:build"]
run = "go build ./..."
description = "Compile every Go package in CI"

[tasks."ci:vet"]
run = "go vet ./..."
description = "Vet all packages"

[tasks."ci:test"]
run = "go test -race -count=1 ./..."
description = "Run Go tests with the race detector"

[tasks."ci:lint"]
run = "golangci-lint run ./... --timeout=5m"
description = "Lint Go code in CI"

# Aggregate gate for CI.
[tasks."ci:check"]
description = "Full CI gate: format, tidy, build, vet, test, lint"
depends = [
  "ci:fmt",
  "ci:tidy",
  "ci:build",
  "ci:vet",
  "ci:test",
  "ci:lint",
]

# Build the site and its PDFs, then publish dist to Netlify. Netlify itself does
# not build (see netlify.toml), because WeasyPrint cannot run in its build image,
# so this task is the single deploy path. NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID
# come from the environment (CI secrets); --dir is website/dist, which site:build
# fills with the HTML and the WeasyPrint-rendered PDFs.
[tasks."site:deploy"]
dir = "website"
depends = ["site:build"]
# Publish to production only when NETLIFY_DEPLOY_PROD=true (the main branch in
# CI). Any other branch gets a preview deploy (a unique draft URL), so the whole
# pipeline can be exercised without touching production.
run = '''
msg="$(git rev-parse --short HEAD)"
# --no-build: deploy the dist that site:build already produced (HTML + the
# WeasyPrint PDFs). Without it, netlify-cli runs its own Astro build, which wipes
# dist and drops the PDFs (they come from a separate mise task, not astro build).
if [ "$NETLIFY_DEPLOY_PROD" = "true" ]; then
  netlify deploy --dir=dist --no-build --prod --message "$msg"
else
  netlify deploy --dir=dist --no-build --message "$msg"
fi
'''
description = "Build the site and PDFs, then deploy dist to Netlify (--prod when NETLIFY_DEPLOY_PROD=true)"
