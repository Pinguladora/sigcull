# Local development tooling, layered on top of mise.toml when the `dev` env is
# active. .miserc.toml sets `env = ["dev"]`, so this loads by default for local
# work but never in CI (CI sets MISE_ENV=ci). Everything here is lint/format/hook
# or validation tooling the build and deploy never need.

[env]
HK_MISE = 1

[hooks]
# Install/update the git hooks when tools are installed. Lives here (not in
# mise.toml) so it does not run in CI, where hk is not installed.
postinstall = "hk install --mise"

[tools]
# actionlint and zizmor live in mise.toml (shared): the hk pre-push hook uses them
# locally and the lint:gha CI job uses them too.
hk = "2.3.0"
pinact = "5.0.0"                   # pin GitHub Actions to a SHA (hk pre-push)
oxlint = "1.82.0"                  # JS/TS linter for the website test toolchain
oxfmt = "0.71.0"                   # JS/TS formatter
yamlfmt = "0.21.0"                 # YAML formatter (hk pairs it with yamllint)
yamllint = "1.38.0"
"github:mongodb/kingfisher" = "v2.7.0"   # secret scanner (hk + secret:* tasks)
# Explicit channel so Renovate's conda datasource can look it up. A bare conda
# name has no channel and 404s at the anaconda API. mise already defaults to
# conda-forge so resolution and the lockfile are unchanged.
"conda:verapdf" = { version = "1.31.91", channel = "conda-forge" } # PDF/UA-1 validator (site:pdf-validate)
