[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
install_before = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]

[tools]
"github:mongodb/kingfisher" = "1.109.0"
cocogitto = "7.0.0"
pinact = "4.1.0"
go = "1.26.5"
golangci-lint = "2.12.2"
prek = "0.4.11"
hugo-extended = "0.165.0"
"github:Pagefind/pagefind" = "1.5.2"
"conda:WeasyPrint" = "69.0"

[tasks."secret:scan"]
run = "kingfisher scan . --no-validate --redact"
description = "Scan codebase for secrets with Kingfisher"
alias = "ss"

[tasks."secret:validate"]
run = "kingfisher scan . --redact"
description = "Validate (and revoke) live secrets found by Kingfisher"
alias = "sv"

[tasks.bump]
run = "cog bump --auto"
description = "Calculate next version from conventional commits and tag"

[tasks.lint]
description = "Run all linting"
depends = ["lint:*"]

[tasks.build]
run = "go build ./..."
description = "Build all Go packages"
alias = "b"

[tasks.test]
run = "go test ./..."
description = "Run all Go tests"
alias = "t"

[tasks."lint:go"]
run = "golangci-lint run ./... --fix"
description = "Lint Go code with autofix"
sources = ["**/*.go"]

[tasks.fmt]
run = "gofmt -w ."
description = "Format all Go code"
alias = "f"

[tasks."fmt:check"]
run = """
files=$(gofmt -l .)
if [ -n "$files" ]; then
  echo "Not gofmt-clean, run 'mise run fmt':"
  echo "$files"
  exit 1
fi
"""
description = "Fail if any Go file is not gofmt-clean"

[tasks.vet]
run = "go vet ./..."
description = "Vet all packages"

[tasks.tidy]
run = "go mod tidy"
description = "Tidy go.mod and go.sum"

[tasks."roots:update"]
run = "go run ./tools/fetch-trusted-root"
description = "Refresh the vendored public-good Sigstore trusted root"

# Pre-commit gate. Run before every atomic commit.
[tasks.check]
description = "Pre-commit gate: format, vet, build, test, lint"
depends = ["fmt:check", "vet", "build", "test", "lint"]

[tasks."site:serve"]
dir = "website"
run = "hugo server"
description = "Serve the website locally with live reload"

# The full build is expressed as a dependency graph so ordering is automatic and
# Hugo runs once. This matters because hugo --cleanDestinationDir wipes the
# search index and the PDFs, so search and pdf must run after the single html
# build, never triggering another one.
[tasks."site:html"]
dir = "website"
run = "hugo --minify --cleanDestinationDir"
description = "Build the site HTML (cleans public)"

[tasks."site:search"]
dir = "website"
depends = ["site:html"]
run = "pagefind --site public"
description = "Generate the Pagefind search index"

[tasks."site:pdf"]
dir = "website"
depends = ["site:html"]
run = [
  "weasyprint --pdf-variant=pdf/ua-1 public/print.html public/sigcull-docs.pdf",
  "weasyprint --pdf-variant=pdf/ua-1 public/es/print.html public/es/sigcull-docs.pdf",
  'for f in public/docs/*/print.html public/es/docs/*/print.html; do if [ -f "$f" ]; then weasyprint --pdf-variant=pdf/ua-1 "$f" "${f%.html}.pdf"; fi; done',
]
description = "Render tagged PDF/UA-1 files with WeasyPrint (needs WeasyPrint)"

[tasks."site:pdf-validate"]
dir = "website"
depends = ["site:pdf"]
run = "verapdf --flavour ua1 public/sigcull-docs.pdf"
description = "Validate the PDF against PDF/UA-1 with veraPDF"

[tasks."site:build"]
depends = ["site:search", "site:pdf"]
description = "Full build: HTML (once), then the search index and PDFs"
