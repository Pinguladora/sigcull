[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
install_before = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]
# Decide task freshness by hashing source contents, not mtimes. Hugo rewrites
# all of public on every build and a fresh checkout resets mtimes, so mtime
# comparison would rebuild needlessly, content hashing skips when bytes are equal.
task.source_freshness_hash_contents = true

[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = "hk install --mise"

[tools]
cocogitto = "7.0.0"
pinact = "4.1.1"
go = "1.26.6"
node = "26.7.0"
pnpm = "11.25.0"
oxlint = "1.77.0"        # JS/TS linter for the website test toolchain
oxfmt = "0.65.0"         # JS/TS formatter
yamlfmt = "0.21.0"       # YAML formatter (hk check-yaml pairs it with yamllint)
golangci-lint = "2.12.2"
hugo-extended = "0.165.0"
"github:Pagefind/pagefind" = "1.5.2"
"conda:WeasyPrint" = "69.0"
"conda:verapdf" = "1.31.91"   # PDF/UA-1 validator
hk = "1.55.0"
yamllint = "1.38.0"
"github:mongodb/kingfisher" = "v1.113.0"

[tasks."secret:scan"]
run = "kingfisher scan . --no-validate --redact"
description = "Scan codebase for secrets with Kingfisher"
alias = "ss"

[tasks."secret:validate"]
run = "kingfisher scan . --redact"
description = "Validate and revoke live secrets found by Kingfisher"
alias = "sv"

[tasks.bump]
run = "cog bump --auto"
description = "Calculate next version from conventional commits and tag"

[tasks.lint]
description = "Run all linting"
depends = ["lint:*"]

[tasks.build]
run = "go build ./..."
description = "Build all Go packages"
alias = "b"

[tasks.test]
run = "go test ./..."
description = "Run all Go tests"
alias = "t"

[tasks."lint:go"]
run = "golangci-lint run ./... --fix"
description = "Lint Go code with autofix"
sources = ["**/*.go"]

[tasks.fmt]
run = "gofmt -w ."
description = "Format all Go code"
alias = "f"

[tasks."fmt:check"]
run = """
files=$(gofmt -l .)
if [ -n "$files" ]; then
  echo "Not gofmt-clean, run 'mise run fmt':"
  echo "$files"
  exit 1
fi
"""
description = "Fail if any Go file is not gofmt-clean"

[tasks.vet]
run = "go vet ./..."
description = "Vet all packages"

[tasks.tidy]
run = "go mod tidy"
description = "Tidy go.mod and go.sum"

[tasks."roots:update"]
run = "go run ./tools/fetch-trusted-root"
description = "Refresh the vendored public-good Sigstore trusted root"

# Pre-commit gate. Run before every atomic commit.
[tasks.check]
description = "Pre-commit gate: format, vet, build, test, lint"
depends = ["fmt:check", "vet", "build", "test", "lint"]

[tasks."site:serve"]
dir = "website"
run = "hugo server --minify --disableLiveReload"
description = "Serve the website locally"

[tasks."site:serve-hr"]
dir = "website"
run = "hugo server"
description = "Serve the website locally with live reload"

# The full build is expressed as a dependency graph so ordering is automatic and
# Hugo runs once. This matters because hugo --cleanDestinationDir wipes the
# search index and the PDFs, so search and pdf must run after the single html
# build, never triggering another one.
[tasks."site:changelog"]
# Runs from the repo root so cog reads cog.toml and the full git history. The
# website changelog page renders this file, so it is generated, not hand-written.
run = "cog changelog > website/assets/changelog.md"
description = "Generate the changelog from conventional commits with Cocogitto"

[tasks."site:html"]
dir = "website"
depends = ["site:changelog"]
run = "hugo --minify --cleanDestinationDir"
description = "Build the site HTML (cleans public)"
# Cache keys are relative to the task `dir` (website). Rebuild when any Hugo input
# changes, including the ADRs mounted from ../docs/adr.
sources = [
  "hugo.yaml",
  "content/**/*",
  "layouts/**/*",
  "assets/**/*",
  "static/**/*",
  "../docs/adr/**/*",
]
# Scope to the HTML only. A broad public/**/* would overlap the PDF and Pagefind
# outputs, and with content hashing that overlap makes this task always stale.
outputs = ["public/**/*.html"]

[tasks."site:search"]
dir = "website"
depends = ["site:html"]
run = "pagefind --site public"
description = "Generate the Pagefind search index"
# A skipped site:html leaves the HTML untouched, so the index stays fresh too.
sources = ["public/**/*.html"]
outputs = ["public/pagefind/**/*"]

[tasks."site:pdf"]
dir = "website"
depends = ["site:html"]
# Render each print page as PDF/A-3a, then WeasyPrint's finisher hook stamps the
# PDF/UA-1 identifier into the same XMP, so every PDF is both archival (PDF/A-3a)
# and accessible (PDF/UA-1). --pdf-variant carries only one claim, so the second
# is added in tools/render-pdf.py using WeasyPrint's own pydyf (no extra dep).
# The interpreter is the conda WeasyPrint env's python, where weasyprint imports.
run = [
  '"$(mise where conda:WeasyPrint)/bin/python" tools/render-pdf.py public/print.html public/sigcull-docs.pdf',
  '"$(mise where conda:WeasyPrint)/bin/python" tools/render-pdf.py public/es/print.html public/es/sigcull-docs.pdf',
  'PY="$(mise where conda:WeasyPrint)/bin/python"; find public -type f -path "*/docs/*" -name print.html | while IFS= read -r f; do "$PY" tools/render-pdf.py "$f" "${f%.html}.pdf"; done',
]
description = "Render dual PDF/A-3a + PDF/UA-1 files with WeasyPrint"
# WeasyPrint is the slow step; skip it when the print HTML or the renderer is unchanged.
sources = ["public/**/print.html", "tools/render-pdf.py"]
outputs = ["public/**/*.pdf"]

[tasks."site:pdf-validate"]
dir = "website"
depends = ["site:pdf"]
# The document declares both standards, so validate both. veraPDF exits
# non-zero on non-compliance, failing the task if either claim is not met.
run = [
  "verapdf --flavour ua1 public/sigcull-docs.pdf",
  "verapdf --flavour 3a public/sigcull-docs.pdf",
]
description = "Validate the PDF is both PDF/UA-1 and PDF/A-3a with veraPDF"
# No output file, sources alone lets mise skip re-validation of an unchanged PDF.
sources = ["public/sigcull-docs.pdf"]

[tasks."site:build"]
depends = ["site:search", "site:pdf"]
description = "Full build: HTML (once), then the search index and PDFs"

# Local accessibility + visual testing (Node toolchain, not the site build)

[tasks."site:htmlvalidate"]
dir = "website"
depends = ["site:html"]
run = "pnpm exec html-validate 'public/**/*.html'"
description = "Static HTML/markup validation of the built site"

[tasks."site:a11y"]
dir = "website"
depends = ["site:search"]
run = "pnpm exec playwright test"
description = "axe (WCAG 2.2 AA), keyboard, and odiff visual tests against the built site"

[tasks."site:verify"]
depends = ["site:htmlvalidate", "site:a11y"]
description = "Run every static-site check: markup, accessibility, and visual"

[tasks."site:sr-setup"]
dir = "website"
# One-time, Windows only. NVDA and the guidepup control addon are native assets,
# not npm packages, so they install separately from `pnpm install`, the same way
# Playwright browsers do. Needs @guidepup/guidepup as a direct devDependency
# (declared in package.json), so run `pnpm install` before this.
run = [
  "pnpm dlx @guidepup/setup setup",
  "pnpm dlx @guidepup/setup install",
]
description = "One-time NVDA and guidepup addon install for site:sr (Windows only)"

[tasks."site:sr"]
dir = "website"
depends = ["site:search"]
run = "pnpm exec playwright test --config playwright.sr.config.ts"
description = "Real-NVDA screen-reader tests (Windows)"
