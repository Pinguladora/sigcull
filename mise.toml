[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
install_before = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]
# Decide task freshness by hashing source contents, not mtimes. A fresh checkout
# resets mtimes, so mtime comparison would rebuild needlessly, while content
# hashing skips when the bytes are equal.
task.source_freshness_hash_contents = true

[tools]
# Tools shared by local dev and CI. Local-only tooling (linters, formatters, git
# hooks, PDF validation) lives in mise.dev.toml, loaded via .miserc's `dev` env,
# so CI never pulls it. go and golangci-lint stay here because both local Go work
# and the Go release CI need them.
cocogitto = "7.0.0"
go = "1.26.6"
node = "26.7.0"
pnpm = "11.25.0"
golangci-lint = "2.12.2"
"conda:WeasyPrint" = "69.0"

[tasks."secret:scan"]
run = "kingfisher scan . --no-validate --redact"
description = "Scan codebase for secrets with Kingfisher"
alias = "ss"

[tasks."secret:validate"]
run = "kingfisher scan . --redact"
description = "Validate and revoke live secrets found by Kingfisher"
alias = "sv"

[tasks.bump]
run = "cog bump --auto"
description = "Calculate next version from conventional commits and tag"

[tasks.lint]
description = "Run all linting"
depends = ["lint:*"]

[tasks.build]
run = "go build ./..."
description = "Build all Go packages"
alias = "b"

[tasks.test]
run = "go test ./..."
description = "Run all Go tests"
alias = "t"

[tasks."lint:go"]
run = "golangci-lint run ./... --fix"
description = "Lint Go code with autofix"
sources = ["**/*.go"]

[tasks.fmt]
run = "gofmt -w ."
description = "Format all Go code"
alias = "f"

[tasks."fmt:check"]
run = """
files=$(gofmt -l .)
if [ -n "$files" ]; then
  echo "Not gofmt-clean, run 'mise run fmt':"
  echo "$files"
  exit 1
fi
"""
description = "Fail if any Go file is not gofmt-clean"

[tasks.vet]
run = "go vet ./..."
description = "Vet all packages"

[tasks.tidy]
run = "go mod tidy"
description = "Tidy go.mod and go.sum"

[tasks."roots:update"]
run = "go run ./tools/fetch-trusted-root"
description = "Refresh the vendored public-good Sigstore trusted root"

# Pre-commit gate. Run before every atomic commit.
[tasks.check]
description = "Pre-commit gate: format, vet, build, test, lint"
depends = ["fmt:check", "vet", "build", "test", "lint"]

[tasks."site:serve"]
dir = "website"
run = "pnpm dev"
description = "Serve the website locally with live reload"

[tasks."site:preview"]
dir = "website"
# Builds the full site AND the PDFs, then serves dist/ with a static server, so
# the per-page PDF downloads work here (unlike site:serve, which is `astro dev`
# and only serves source, never the dist/ build artifacts). Ctrl-C to stop.
depends = ["site:build"]
run = "node_modules/.bin/http-server dist -p 4321 -a 127.0.0.1 -c-1"
description = "Build (site + PDFs) and serve dist/ locally, PDFs included"

[tasks."site:changelog"]
run = "cog changelog | sed -E 's/^#### /### /' > website/src/generated/changelog.md"
description = "Generate the changelog from conventional commits with Cocogitto"

[tasks."site:install"]
dir = "website"
run = "pnpm install --frozen-lockfile"
description = "Install the website's Node dependencies"
sources = ["package.json", "pnpm-lock.yaml"]
outputs = ["node_modules/.modules.yaml"]

[tasks."site:build-html"]
dir = "website"
depends = ["site:install", "site:changelog"]
run = "pnpm build"
description = "Build the website (HTML, Pagefind, llms.txt, print pages)"
sources = [
  "astro.config.mjs",
  "src/**/*",
  "public/**/*",
  "package.json",
  "pnpm-lock.yaml",
]
outputs = ["dist/**/*.html"]

[tasks."site:pdf"]
dir = "website"
depends = ["site:build-html"]
# Render the full handbook per language as PDF/A-3a, then the finisher hook stamps
# the PDF/UA-1 identifier into the same XMP, so each PDF is both archival and
# accessible.
run = '''
PY="$(mise where conda:WeasyPrint)/bin/python"
export PY
# Full-language handbooks (backgrounded).
"$PY" tools/render-pdf.py dist/print/index.html dist/sigcull-docs.pdf &
"$PY" tools/render-pdf.py dist/es/print/index.html dist/es/sigcull-docs.pdf &
# One PDF per page at dist/<slug>.pdf (the Download-PDF action target), with
# limited concurrency so a large doc set does not spawn too many WeasyPrint runs.
find dist/print -mindepth 2 -name index.html -print0 \
  | xargs -0 -P 4 -I {} bash -c 'f="$1"; s="${f#dist/print/}"; s="${s%/index.html}"; "$PY" tools/render-pdf.py "$f" "dist/${s}.pdf"' _ {}
wait
'''
description = "Render PDF/A-3a + PDF/UA-1 handbooks and per-page PDFs with WeasyPrint"
sources = ["dist/print/**/*.html", "dist/es/print/*.html", "tools/render-pdf.py"]
outputs = ["dist/**/*.pdf"]

[tasks."site:pdf-validate"]
dir = "website"
depends = ["site:pdf"]
# veraPDF exits non-zero on non-compliance, failing the task if either claim is not met.
run = [
  "verapdf --flavour ua1 dist/sigcull-docs.pdf",
  "verapdf --flavour 3a dist/sigcull-docs.pdf",
  "verapdf --flavour ua1 dist/es/sigcull-docs.pdf",
  "verapdf --flavour 3a dist/es/sigcull-docs.pdf",
]
description = "Validate the PDFs are both PDF/UA-1 and PDF/A-3a with veraPDF"
sources = ["dist/sigcull-docs.pdf", "dist/es/sigcull-docs.pdf"]

[tasks."site:build"]
depends = ["site:build-html", "site:pdf"]
description = "Full build: site (once), then the PDFs"

[tasks."site:htmlvalidate"]
dir = "website"
depends = ["site:build-html"]
run = "pnpm exec html-validate 'dist/**/*.html'"
description = "Static HTML/markup validation of the built website"

[tasks."site:a11y"]
dir = "website"
depends = ["site:build-html"]
run = "pnpm exec playwright test"
description = "axe (WCAG 2.2 AA), keyboard, and odiff visual tests against the built website"

[tasks."site:verify"]
depends = ["site:htmlvalidate", "site:a11y"]
description = "Run every static-site check: markup, accessibility, and visual"

[tasks."site:sr-setup"]
dir = "website"
# Windows only. NVDA and the guidepup control addon are native assets,
# not npm packages, so they install separately from `pnpm install`. Needs
# @guidepup/guidepup as a direct devDependency, so run `pnpm install` first.
run_windows = [
  "pnpm dlx @guidepup/setup setup",
  "pnpm dlx @guidepup/setup install",
]
description = "One-time NVDA and guidepup addon install for site:sr"

[tasks."site:sr"]
dir = "website"
depends = ["site:build-html"]
run = "pnpm exec playwright test --config playwright.sr.config.ts"
description = "Real-NVDA screen-reader tests for the website (Windows)"

[tasks."site:unlighthouse"]
dir = "website"
depends = ["site:build-html"]
# Crawl every page of the built site and run Lighthouse on each (performance,
# a11y, best-practices, SEO).
run = '''
# Free the port in case a previous run left one behind.
fuser -k 8099/tcp 2>/dev/null || true
sleep 1
node_modules/.bin/http-server dist -p 8099 -a 127.0.0.1 -c-1 --silent &
SRV=$!
trap 'kill $SRV 2>/dev/null' EXIT
sleep 2
pnpm dlx unlighthouse-ci --site http://127.0.0.1:8099 --no-cache
'''
description = "Full-site Lighthouse audit of every page with Unlighthouse"
